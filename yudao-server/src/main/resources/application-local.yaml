server:
  address: 127.0.0.1
  port: ${CURMERCE_SERVER_PORT:48080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  datasource:
    druid:
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 500
        wall:
          config:
            multi-statement-allow: false
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 10
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
      datasource:
        master:
          name: ${MYSQL_DATABASE:curmerce}
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:curmerce}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: ${MYSQL_USER:curmerce}
          password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USER:curmerce}
      password: ${REDIS_PASSWORD}
  quartz:
    auto-startup: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}

curmerce:
  auction:
    # Core rejects legacy Auction writes once the independent service is cut over.
    local-store-enabled: ${CURMERCE_AUCTION_LOCAL_STORE_ENABLED:false}
  outbox:
    transport: ${CURMERCE_OUTBOX_TRANSPORT:redis}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      topic: ${CURMERCE_KAFKA_TOPIC:curmerce.events.v1}
      consumer-group: ${CURMERCE_KAFKA_CONSUMER_GROUP:curmerce-core-ledger-v1}
      publish-timeout: ${CURMERCE_KAFKA_PUBLISH_TIMEOUT:5s}
  media:
    max-upload-size: ${CURMERCE_MEDIA_MAX_UPLOAD_SIZE:10MB}
    derivatives-enabled: ${CURMERCE_MEDIA_DERIVATIVES_ENABLED:true}
    clam-av:
      enabled: ${CURMERCE_MEDIA_CLAMAV_ENABLED:false}
      fail-closed: ${CURMERCE_MEDIA_CLAMAV_FAIL_CLOSED:true}
      host: ${CURMERCE_MEDIA_CLAMAV_HOST:127.0.0.1}
      port: ${CURMERCE_MEDIA_CLAMAV_PORT:53310}
    imgproxy:
      enabled: ${CURMERCE_MEDIA_IMGPROXY_ENABLED:false}
      endpoint: ${CURMERCE_MEDIA_IMGPROXY_ENDPOINT:http://127.0.0.1:58081}
      key-hex: ${CURMERCE_MEDIA_IMGPROXY_KEY:}
      salt-hex: ${CURMERCE_MEDIA_IMGPROXY_SALT:}
    moderation:
      enabled: ${CURMERCE_MEDIA_MODERATION_ENABLED:false}
      endpoint: ${CURMERCE_MEDIA_MODERATION_ENDPOINT:}
      bearer-token: ${CURMERCE_MEDIA_MODERATION_TOKEN:}
      fail-closed: ${CURMERCE_MEDIA_MODERATION_FAIL_CLOSED:true}

logging:
  file:
    name: ${CURMERCE_LOG_FILE:${user.home}/.local/state/curmerce/yudao-server.log}
  level:
    root: INFO
    cn.iocoder.yudao: INFO

wx:
  mp:
    app-id: local-disabled
    secret: local-disabled
  miniapp:
    appid: local-disabled
    secret: local-disabled

yudao:
  access-log:
    enable: false
