spring:
  main:
    lazy-initialization: true
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:commerce-test;MODE=MYSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=value
    driver-class-name: org.h2.Driver
    username: sa
    password:
    druid:
      async-init: false
      initial-size: 1
  sql:
    init:
      schema-locations: classpath:/sql/create_tables.sql
  data:
    redis:
      host: 127.0.0.1
      port: 16389
mybatis:
  lazy-initialization: true
yudao:
  info:
    base-package: cn.iocoder.yudao.module
