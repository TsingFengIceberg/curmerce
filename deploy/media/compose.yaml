name: curmerce-media

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/media/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/media/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - ${MEDIA_DATA_DIR:?set MEDIA_DATA_DIR in deploy/media/.env}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-curmerce-media}
    volumes:
      - ./cors.json:/config/cors.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc cors set "local/$${MINIO_BUCKET}" /config/cors.json

  clamav:
    image: clamav/clamav:1.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-53310}:3310"
    volumes:
      - ${MEDIA_DATA_DIR}/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 2m

  imgproxy:
    image: darthsim/imgproxy:v3.28.0
    restart: unless-stopped
    network_mode: host
    environment:
      IMGPROXY_BIND: 127.0.0.1:${IMGPROXY_PORT:-58081}
      IMGPROXY_PORT: ${IMGPROXY_PORT:-58081}
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY in deploy/media/.env}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT in deploy/media/.env}
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_MAX_ANIMATION_FRAMES: "1"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_REQUESTS_QUEUE_SIZE: "32"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${IMGPROXY_PORT}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
