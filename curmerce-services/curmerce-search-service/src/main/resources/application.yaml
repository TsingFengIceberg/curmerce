spring:
  application:
    name: curmerce-search-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}

server:
  address: 127.0.0.1
  port: ${CURMERCE_SEARCH_PORT:48085}

curmerce:
  search:
    enabled: ${CURMERCE_SEARCH_ENABLED:false}
    elasticsearch-url: ${CURMERCE_ELASTICSEARCH_URL:http://127.0.0.1:19200}
    product-index: ${CURMERCE_SEARCH_PRODUCT_INDEX:curmerce-products-v1}
    post-index: ${CURMERCE_SEARCH_POST_INDEX:curmerce-posts-v1}
    kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
    kafka-topic: ${CURMERCE_SEARCH_KAFKA_TOPIC:curmerce.events.v1}
    kafka-consumer-group: ${CURMERCE_SEARCH_KAFKA_CONSUMER_GROUP:curmerce-search-v1}
    core-base-url: ${CURMERCE_CORE_BASE_URL:http://127.0.0.1:48080}
    community-base-url: ${CURMERCE_COMMUNITY_BASE_URL:http://127.0.0.1:48083}
    request-timeout: ${CURMERCE_SEARCH_REQUEST_TIMEOUT:5s}
    rebuild-token: ${CURMERCE_SEARCH_REBUILD_TOKEN:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}

logging:
  file:
    name: ${CURMERCE_SEARCH_LOG_FILE:${user.home}/.local/state/curmerce/search-service.log}
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"
