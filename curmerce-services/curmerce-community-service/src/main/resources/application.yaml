spring:
  application:
    name: curmerce-community-service
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
  datasource:
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 8
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
      datasource:
        master:
          name: ${COMMUNITY_MYSQL_DATABASE:curmerce_community}
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${COMMUNITY_MYSQL_DATABASE:curmerce_community}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${COMMUNITY_MYSQL_USER:curmerce_community}
          password: ${COMMUNITY_MYSQL_PASSWORD:${MYSQL_PASSWORD}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  address: 127.0.0.1
  port: ${CURMERCE_COMMUNITY_PORT:48083}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: NONE
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  type-aliases-package: cn.iocoder.yudao.module.community.dal.dataobject

mybatis-plus-join:
  banner: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

knife4j:
  enable: true

yudao:
  info:
    version: 0.2.0-SNAPSHOT
    base-package: cn.iocoder.yudao
  security:
    mock-enable: false
    permit-all-urls:
      - /actuator/health
  web:
    admin-ui:
      url: http://127.0.0.1:48082
  access-log:
    enable: false
  api-encrypt:
    enable: false
  tenant:
    enable: false
  swagger:
    title: Curmerce Community API
    description: Independently deployable community service
    author: Curmerce
    version: ${yudao.info.version}
    url: http://127.0.0.1:48083
    email: devnull@localhost
    license: MIT
    license-url: https://opensource.org/licenses/MIT

curmerce:
  search:
    events-enabled: ${CURMERCE_SEARCH_EVENTS_ENABLED:false}
    kafka-topic: ${CURMERCE_SEARCH_KAFKA_TOPIC:curmerce.events.v1}
    publish-delay-ms: ${CURMERCE_SEARCH_PUBLISH_DELAY_MS:2000}
    max-attempts: ${CURMERCE_SEARCH_MAX_ATTEMPTS:5}
  cloud:
    core:
      base-url: ${CURMERCE_CORE_BASE_URL:http://127.0.0.1:48080}
      internal-token: ${CURMERCE_INTERNAL_TOKEN:${CURMERCE_OAUTH_CLIENT_SECRET:}}
      connect-timeout: ${CURMERCE_CORE_CONNECT_TIMEOUT:1s}
      read-timeout: ${CURMERCE_CORE_READ_TIMEOUT:2s}
  community-media-outbox:
    publish-delay-ms: ${COMMUNITY_MEDIA_OUTBOX_PUBLISH_DELAY_MS:2000}
    reconcile-delay-ms: ${COMMUNITY_MEDIA_OUTBOX_RECONCILE_DELAY_MS:60000}
    batch-size: ${COMMUNITY_MEDIA_OUTBOX_BATCH_SIZE:50}
    lease-duration: ${COMMUNITY_MEDIA_OUTBOX_LEASE_DURATION:30s}
    max-backoff: ${COMMUNITY_MEDIA_OUTBOX_MAX_BACKOFF:5m}

resilience4j:
  circuitbreaker:
    instances:
      coreService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}

logging:
  file:
    name: ${CURMERCE_COMMUNITY_LOG_FILE:${user.home}/.local/state/curmerce/community-service.log}
  pattern:
    level: "%5p [correlationId=%X{correlationId:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
